<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBindings identity specimen</title>
    <link rel="icon" href="../assets/generated/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem;
        color: #171714;
        background: #efefec;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.125rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
        gap: 1.5rem;
      }

      .panel {
        min-width: 0;
        padding: 1.5rem;
        border-radius: 0.75rem;
      }

      .panel--light {
        color: #000;
        background: #fff;
      }

      .panel--dark {
        color: #e5e5e5;
        background: #0a0a0a;
      }

      .row {
        display: flex;
        min-height: 8.5rem;
        flex-wrap: wrap;
        gap: 1.375rem;
        align-items: end;
      }

      figure {
        margin: 0;
        text-align: center;
      }

      .mark {
        height: var(--size);
      }

      .mark svg {
        display: block;
        width: auto;
        height: 100%;
      }

      figcaption {
        margin-top: 0.5rem;
        color: #757575;
        font-size: 0.6875rem;
      }

      .panel--dark figcaption {
        color: #a3a3a3;
      }
    </style>
  </head>
  <body>
    <h1>OpenBindings glyph · identity revision 1</h1>
    <main class="grid">
      <section class="panel panel--light" aria-label="Light surface">
        <div class="row" data-specimens></div>
      </section>
      <section class="panel panel--dark" aria-label="Dark surface">
        <div class="row" data-specimens></div>
      </section>
    </main>
    <template id="specimen">
      <figure>
        <div class="mark" aria-hidden="true"></div>
        <figcaption></figcaption>
      </figure>
    </template>
    <script type="module">
      const sizes = [16, 20, 24, 32, 48, 96];
      const glyph = await fetch("../assets/openbindings-glyph.svg").then((response) =>
        response.text(),
      );
      const template = document.querySelector("#specimen");

      for (const row of document.querySelectorAll("[data-specimens]")) {
        for (const size of sizes) {
          const fragment = template.content.cloneNode(true);
          const mark = fragment.querySelector(".mark");
          mark.style.setProperty("--size", `${size}px`);
          mark.innerHTML = glyph;
          fragment.querySelector("figcaption").textContent = `${size}px`;
          row.append(fragment);
        }
      }
    </script>
  </body>
</html>
