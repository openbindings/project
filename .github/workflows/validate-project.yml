name: Validate project records

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Enforce verified-cohort immutability
        if: github.event_name == 'pull_request'
        run: node scripts/validate-project.mjs --base "${{ github.event.pull_request.base.sha }}"
